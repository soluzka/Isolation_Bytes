# nginx reverse proxy for the Antivirus Cloud Server.
#
# This is the file that fixes the /get_folder_watcher_paths 404 on the live
# site: it forwards EVERYTHING (HTML pages AND API endpoints) to the Flask app
# running behind waitress on 127.0.0.1:5002. If your existing nginx config has
# a `location /` that serves static files from a directory instead of
# proxy_pass-ing, that is exactly why the API endpoints 404 -- the request
# never reaches Flask.
#
# Install on Ubuntu/Debian:
#   sudo cp deploy/nginx-antivirus-cloud.conf /etc/nginx/sites-available/antivirus-cloud
#   sudo ln -s /etc/nginx/sites-available/antivirus-cloud /etc/nginx/sites-enabled/
#   sudo nginx -t            # validate config
#   sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN, YOUR_PUBLIC_PORT, and the ssl_certificate paths with
# your real values. (deploy.sh does this substitution automatically.)

# HTTP -> HTTPS redirect (so http://soluzka.com jumps to https://soluzka.com:8443).
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;
    return 301 https://$host:YOUR_PUBLIC_PORT$request_uri;
}

server {
    listen YOUR_PUBLIC_PORT ssl http2;
    listen [::]:YOUR_PUBLIC_PORT ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Replace with the paths to your GoDaddy/Let's Encrypt cert + key.
    ssl_certificate     /etc/ssl/certs/yourdomain.crt;
    ssl_certificate_key /etc/ssl/private/yourdomain.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Max upload size for /encrypt, /decrypt, /agent/report file uploads.
    client_max_body_size 100m;

    # Forward EVERY path to the Flask app. This is what makes
    # /get_folder_watcher_paths, /folder-watcher-paths,
    # /get_network_monitored_directories, /dashboard, etc. all work.
    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket support (in case any future feature needs it).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Don't buffer streaming / long-poll responses.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Optional: serve /static/ directly from disk for speed. Only enable this
    # if the repo is checked out on the VPS at /opt/antivirus-yara-rules-c and
    # you want nginx to skip Flask for static assets. If you leave it
    # commented out, Flask will serve static files itself (slightly slower but
    # simpler and guaranteed correct).
    #
    # location /static/ {
    #     alias /opt/antivirus-yara-rules-c/static/;
    #     expires 7d;
    #     add_header Cache-Control "public, immutable";
    # }
}

# Required by the WebSocket upgrade headers above.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
