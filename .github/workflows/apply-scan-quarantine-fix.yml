name: Apply scan and quarantine fix
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [security-v2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch scan acknowledgement and automatic quarantine
        run: |
          python - <<'PY'
          from pathlib import Path

          # Backend: make the async command contract explicit.
          p = Path('cloud/cloud_server.py')
          s = p.read_text(encoding='utf-8')
          old = "return jsonify({'ok': True, 'message': f'Scan triggered for {sent} agent(s). Results will appear shortly.', 'agents': sent})"
          new = "return jsonify({'ok': True, 'success': True, 'status': 'accepted', 'message': f'Scan triggered for {sent} agent(s). Results will appear shortly.', 'agents': sent, 'agents_triggered': sent})"
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Agent: automatically quarantine confirmed high/critical YARA findings
          # and very-high-confidence ML findings through quarantine_utils.
          p = Path('standalone_agent.py')
          s = p.read_text(encoding='utf-8')
          old = """                            if _rank_of(highest) >= _rank_of('high'):\n                                self._threats_blocked += 1\n                                # Block in place only — no quarantine during scan.\n                                # Quarantine is a separate manual action from the dashboard.\n                                bok = self._block_file_in_place(filepath)"""
          new = """                            if _rank_of(highest) >= _rank_of('high'):\n                                self._threats_blocked += 1\n                                # Contain first, then automatically quarantine confirmed\n                                # high/critical malware. _quarantine_file() delegates to\n                                # quarantine_utils, whose canonical destination is\n                                # %USERPROFILE%\\AppData\\Local\\Temp\\Defender_Quarantine.\n                                bok = self._block_file_in_place(filepath)"""
          if old in s:
              s = s.replace(old, new, 1)
          old = """                                else:\n                                    # Block failed — try rename fallback\n                                    rok = self._rename_block_fallback(filepath)\n                                    for f in findings:\n                                        if f.get('path') == filepath:\n                                            if rok:\n                                                f['blocked'] = True\n                                                f['renamed'] = True\n                                            else:\n                                                f['block_error'] = True\n                    # ML detection — always run, even on YARA-matched files"""
          new = """                                else:\n                                    # Block failed — try rename fallback\n                                    rok = self._rename_block_fallback(filepath)\n                                    for f in findings:\n                                        if f.get('path') == filepath:\n                                            if rok:\n                                                f['blocked'] = True\n                                                f['renamed'] = True\n                                            else:\n                                                f['block_error'] = True\n                                # Quarantine confirmed high/critical YARA hits after containment.\n                                try:\n                                    if os.path.exists(filepath):\n                                        qok = self._quarantine_file(filepath)\n                                        for f in findings:\n                                            if f.get('path') == filepath:\n                                                f['quarantined'] = bool(qok)\n                                                if qok:\n                                                    f['blocked'] = False\n                                except Exception as qe:\n                                    print(f'[QUARANTINE] Failed for {filepath}: {qe}')\n                    # ML detection — always run, even on YARA-matched files"""
          if old in s:
              s = s.replace(old, new, 1)
          old = """                                self._threats_blocked += 1\n                            print(f\"[ML FINDING] {filepath} | type={ml_ttype} | score={ml_score} | {ml_reason}\")"""
          new = """                                self._threats_blocked += 1\n                            # Quarantine ML-only findings at a strong-confidence threshold.\n                            try:\n                                if ml_suspicious and ml_score >= 80 and os.path.exists(filepath):\n                                    qok = self._quarantine_file(filepath)\n                                    target = next((f for f in findings if f.get('path') == filepath), None)\n                                    if target:\n                                        target['quarantined'] = bool(qok)\n                                        if qok:\n                                            target['blocked'] = False\n                            except Exception as qe:\n                                print(f'[QUARANTINE] ML quarantine failed for {filepath}: {qe}')\n                            print(f\"[ML FINDING] {filepath} | type={ml_ttype} | score={ml_score} | {ml_reason}\")"""
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # UI: patch only the full-scan handler so successful async acknowledgements
          # cannot be routed through an error branch.
          p = Path('templates/yara_scanner.html')
          s = p.read_text(encoding='utf-8')
          marker = 'document.getElementById("scanAllBtn").addEventListener'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('yara_scanner.html scanAll handler not found')
          tail = s[start:]
          old = '.then(r => r.json())'
          if old not in tail:
              raise SystemExit('yara_scanner.html JSON handler not found')
          new = '''.then(async response => {\n                    const text = await response.text();\n                    let data = {};\n                    try { data = text ? JSON.parse(text) : {}; }\n                    catch (e) { throw new Error(`Invalid server response (${response.status})`); }\n                    if (!response.ok) {\n                        throw new Error(data.message || data.error || `Scan request failed (${response.status})`);\n                    }\n                    return data;\n                })'''
          tail = tail.replace(old, new, 1)
          old = 'if (data.ok) {'
          if old not in tail:
              raise SystemExit('yara_scanner.html success branch not found')
          tail = tail.replace(old, "const accepted = data.ok === true || data.success === true || data.status === 'accepted';\n            if (accepted) {", 1)
          s = s[:start] + tail
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-scan-quarantine-fix.yml FIX_SCAN_QUARANTINE_TRIGGER.txt
          git add cloud/cloud_server.py standalone_agent.py templates/yara_scanner.html
          git commit -m 'Fix scan acknowledgement and automatic quarantine'
          git push origin HEAD:${{ github.head_ref }}
