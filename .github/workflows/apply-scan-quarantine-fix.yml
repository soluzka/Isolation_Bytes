name: Remove one-time scan quarantine patch
on:
  pull_request:
    types: [synchronize]
    branches: [security-v2]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove temporary patch files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-scan-quarantine-fix.yml FIX_SCAN_QUARANTINE_TRIGGER.txt
          git commit -m 'Remove one-time scan quarantine patch workflow'
          git push origin HEAD:${{ github.head_ref }}
