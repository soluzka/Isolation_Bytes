name: Fix Index scan trigger status contract

on:
  push:
    branches:
      - security-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security-v2
        uses: actions/checkout@v4
        with:
          ref: security-v2
          fetch-depth: 1

      - name: Apply fallback success contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          text = p.read_text(encoding='utf-8')
          old = "return jsonify({'message': 'Conditional startup requested (fallback)', 'success': True}), 200"
          new = "return jsonify({'ok': True, 'success': True, 'status': 'started', 'accepted': True, 'message_type': 'success', 'message': 'Conditional startup requested (fallback)', 'error': None}), 200"
          if old not in text:
              raise SystemExit('Fallback success response not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fallback fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix conditional startup fallback success response"
          git push origin HEAD:security-v2
