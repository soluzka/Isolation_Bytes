name: Fix Index scan trigger status contract

on:
  push:
    branches:
      - security-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security-v2
        uses: actions/checkout@v4
        with:
          ref: security-v2
          fetch-depth: 1

      - name: Normalize legacy scan trigger response
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          old = "return jsonify({'message': 'Conditional startup triggered', 'success': True}), 200"
          new = "return jsonify({'ok': True, 'success': True, 'status': 'started', 'accepted': True, 'message_type': 'success', 'message': 'Conditional startup triggered', 'error': None}), 200"
          if old in text:
              text = text.replace(old, new, 1)
              app.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected /run_startup success response was not found')

      - name: Commit backend contract fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No backend change required."
            exit 0
          fi
          git commit -m "Fix Index run startup success response"
          git push origin HEAD:security-v2
