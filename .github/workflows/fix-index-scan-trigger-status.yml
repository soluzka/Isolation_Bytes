name: Fix Index scan trigger status contract

on:
  push:
    branches:
      - security-v2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security-v2
        uses: actions/checkout@v4
        with:
          ref: security-v2
          fetch-depth: 1

      - name: Verify backend success contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'status': 'started'" app.py >/dev/null
          grep -F "'success': True" app.py >/dev/null
          grep -F "'error': None" app.py >/dev/null
          echo "Index run-startup success contract is present."
