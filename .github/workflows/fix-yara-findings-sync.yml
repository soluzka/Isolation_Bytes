name: Apply YARA findings synchronization fix

on:
  pull_request:
    branches:
      - security-v2
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref == 'fix-yara-findings-sync-2026-09-25'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-yara-findings-sync-2026-09-25
          fetch-depth: 0

      - name: Patch remaining YARA source filter
        shell: python
        run: |
          from pathlib import Path
          p = Path('quick_start.py')
          s = p.read_text(encoding='utf-8')
          old = """                            if any('persistence' in r.lower() or 'ransomware' in r.lower() for r in rule_names):\n                                yara_suspicious.append({'file': file_path, 'rules': rule_names})\n"""
          new = """                            if rule_names:\n                                yara_suspicious.append({'file': file_path, 'rules': rule_names})\n"""
          if old not in s: raise SystemExit('quick_start YARA filter not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Validate source
        run: python -m py_compile quick_start.py cloud/cloud_server.py quarantine_utils.py

      - name: Commit source change directly to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quick_start.py
          git diff --cached --quiet && exit 0
          git commit -m "Retain every actual YARA match"
          git push origin HEAD:fix-yara-findings-sync-2026-09-25
