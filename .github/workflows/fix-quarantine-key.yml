name: Apply quarantine key loading fix

on:
  push:
    branches:
      - fix-quarantine-key-loading-2026-09-25

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch quarantine key loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('quarantine_utils.py')
          s = p.read_text(encoding='utf-8')
          marker = "import time\n\nICACLS_PATH"
          replacement = '''import time

# The standalone scanner can run without quick_start.py, so explicitly load
# the persisted per-install .env before quarantine_file() reads FERNET_KEY.
try:
    from dotenv import load_dotenv
    import sys as _quarantine_sys
    _local_appdata = os.environ.get('LOCALAPPDATA', os.path.expanduser('~'))
    _env_candidates = []
    if getattr(_quarantine_sys, 'frozen', False):
        _env_candidates.extend([
            os.path.join(os.path.dirname(_quarantine_sys.executable), '.env'),
            os.path.join(_local_appdata, 'antivirus_server', '.env'),
        ])
    else:
        _env_candidates.extend([
            os.path.join(os.path.dirname(os.path.abspath(__file__)), '.env'),
            os.path.join(_local_appdata, 'antivirus_server', '.env'),
            os.path.join(os.getcwd(), '.env'),
        ])
    for _env_path in _env_candidates:
        if os.path.exists(_env_path):
            load_dotenv(_env_path, override=False)
            if len(os.environ.get('FERNET_KEY', '')) == 44:
                break
except Exception as _env_error:
    logging.debug('Unable to load quarantine environment: %s', _env_error)

ICACLS_PATH'''
          if marker not in s:
              raise SystemExit('Expected quarantine_utils import marker not found')
          s = s.replace(marker, replacement, 1)
          old = "    if not FERNET_KEY or len(FERNET_KEY) != 44 or not os.path.isfile(filepath):\n        return False"
          new = "    if not FERNET_KEY or len(FERNET_KEY) != 44 or not os.path.isfile(filepath):\n        logging.error('Quarantine unavailable: FERNET_KEY is missing/invalid or file is unavailable: %s', filepath)\n        return False"
          if old not in s:
              raise SystemExit('Expected quarantine guard not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quarantine_utils.py
          git rm -f .github/workflows/fix-quarantine-key.yml
          git commit -m "Fix standalone quarantine key loading"
          git push origin HEAD:fix-quarantine-key-loading-2026-09-25
