name: Unify agent and YARA dashboard scan status

on:
  push:
    branches:
      - security-v2

permissions:
  contents: read

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security-v2
          fetch-depth: 1

      - name: Verify unified scan status implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -F "def _complete_agent_scan_results_response" cloud/cloud_server.py >/dev/null
          grep -F "build_complete_agent_scan_results(_legacy, _agent_scan_state)" cloud/cloud_server.py >/dev/null
          grep -F "def _agent_trigger_scan_response" cloud/cloud_server.py >/dev/null
          grep -F "'status': 'started'" cloud/cloud_server.py >/dev/null
          grep -F "Promise.allSettled" templates/index.html >/dev/null
          grep -F "fetch('/api/agent-trigger-scan'" templates/index.html >/dev/null
          grep -F "fetch('/run_startup'" templates/index.html >/dev/null
          grep -F "Promise.allSettled" templates/yara_scanner.html >/dev/null
          grep -F "fetch('/run_startup'" templates/yara_scanner.html >/dev/null
          test -f cloud/_agent_results_unlimited.py
          grep -F "'scanned_files': 0" quick_start.py >/dev/null
          grep -F "'quarantined_files': 0" quick_start.py >/dev/null
          grep -F "'blocked_threats': 0" quick_start.py >/dev/null
          grep -F "Publish the scanner's current-run counters directly" quick_start.py >/dev/null
          python -m py_compile quick_start.py cloud/cloud_server.py cloud/_agent_results_unlimited.py conditional_startup.py
          echo "Agent/YARA synchronization and current-generation counter isolation are present."
