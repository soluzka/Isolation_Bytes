name: Unify agent and YARA dashboard scan status

on:
  push:
    branches:
      - security-v2

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security-v2
          fetch-depth: 1

      - name: Normalize Index scan trigger success handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('templates/index.html')
          text = path.read_text(encoding='utf-8')
          old = "if (response.status === 200 && (data.status === 'started' || data.status === 'already_running')) {"
          new = "if (response.status === 200 && (data.status === 'started' || data.status === 'already_running' || data.status === 'success' || data.ok === true || data.success === true)) {"
          if old not in text:
              raise SystemExit('Expected Index scan trigger condition was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit Index fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- templates/index.html; then
            echo "Index scan trigger handling is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.html
          git commit -m "Fix Index scan trigger success handling"
          git push origin HEAD:security-v2

      - name: Verify unified scan status implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -F "def _complete_agent_scan_results_response" cloud/cloud_server.py >/dev/null
          grep -F "build_complete_agent_scan_results(_legacy)" cloud/cloud_server.py >/dev/null
          grep -F "def _agent_trigger_scan_response" cloud/cloud_server.py >/dev/null
          grep -F "'status': 'success'" cloud/cloud_server.py >/dev/null
          grep -F "data.status === 'success'" templates/index.html >/dev/null
          test -f cloud/_agent_results_unlimited.py
          echo "Agent and YARA scan-status integration is present."
