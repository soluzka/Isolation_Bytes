name: Unify agent and YARA dashboard scan status

on:
  push:
    branches:
      - security-v2

permissions:
  contents: read

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security-v2
          fetch-depth: 1

      - name: Validate cloud Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile cloud/cloud_server.py cloud/cloud_server_original.py cloud/_agent_results_unlimited.py

      - name: Validate unlimited standalone agent
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile standalone_agent.py standalone_agent_unlimited.py
          ! grep -nE '^(<<<<<<<|=======|>>>>>>>)' standalone_agent.py standalone_agent.spec
          grep -F "MAX_FILES_PER_SCAN = float('inf')" standalone_agent.py >/dev/null
          grep -F "MAX_SCAN_CYCLE_SECONDS = float('inf')" standalone_agent.py >/dev/null
          grep -F "Continuous scanner: each full traversal starts again immediately" standalone_agent.py >/dev/null

      - name: Verify unified scan status implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -F "def _complete_agent_scan_results_response" cloud/cloud_server.py >/dev/null
          grep -F "build_complete_agent_scan_results(_legacy)" cloud/cloud_server.py >/dev/null
          grep -F "def _agent_trigger_scan_response" cloud/cloud_server.py >/dev/null
          grep -F '"status": "started"' cloud/cloud_server.py >/dev/null
          grep -F "data.status === 'started'" templates/index.html >/dev/null
          test -f cloud/_agent_results_unlimited.py
          echo "Agent and YARA scan-status integration is present."
