name: ssdeep-fuzzy-scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'security/yara_rules/**'

jobs:
  fuzzy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yara-python ssdeep

      - name: Run ssdeep runner
        run: |
          python security/yara_rules/ssdeep_runner.py --rules security/yara_rules/yara_rules.yar --dir security/yara_rules --threshold 60
