name: Repository compromise audit

on:
  push:
    branches: [security-v2]
  pull_request:
    branches: [security-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repository audit
        run: python security/repo_audit.py --output repo-audit.json --fail-on-high

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-bytes-repo-audit
          path: repo-audit.json
          if-no-files-found: warn
