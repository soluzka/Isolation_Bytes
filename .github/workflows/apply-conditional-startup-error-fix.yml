name: Apply conditional startup state sanitization

on:
  push:
    branches:
      - security-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security-v2
          fetch-depth: 1

      - name: Patch conditional startup status producer
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          marker = "# Never expose a successful agent-trigger message as a conditional-startup error."
          anchor = "    resp = dict(state)\n"
          insertion = (
              "    " + marker + "\n"
              "    last_error = resp.get('last_error')\n"
              "    if isinstance(last_error, str) and last_error.lower().startswith('scan triggered for ') and ' agent(s).' in last_error.lower():\n"
              "        resp['last_error'] = None\n"
          )
          if marker not in text:
              if anchor not in text:
                  raise SystemExit('Conditional startup status response anchor not found')
              text = text.replace(anchor, anchor + insertion, 1)
              path.write_text(text, encoding='utf-8')

      - name: Store modified app.py blob in GitHub object database
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          content = open('app.py', 'rb').read()
          payload = json.dumps({
              'content': base64.b64encode(content).decode('ascii'),
              'encoding': 'base64'
          }).encode('utf-8')
          req = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["REPO"]}/git/blobs',
              data=payload,
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json'
              },
              method='POST'
          )
          with urllib.request.urlopen(req) as response:
              result = json.load(response)
          print('MODIFIED_APP_BLOB_SHA=' + result['sha'])