name: Remove agent scan limits

on:
  push:
    branches:
      - security-v2

permissions:
  contents: write

jobs:
  remove-limits:
    if: "!contains(github.event.head_commit.message, '[unlimited-scan-patch]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security-v2
          fetch-depth: 0

      - name: Remove artificial scan cycle limits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('standalone_agent.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('MAX_FILES_PER_SCAN = 5000    # full-system scan budget; keeps the agent aligned with dashboard scans', 'MAX_FILES_PER_SCAN = float(\'inf\')  # no artificial per-cycle file limit')
          s = s.replace('MAX_SCAN_CYCLE_SECONDS = 600 # allow a full-system scan to run for the dashboard scan window', 'MAX_SCAN_CYCLE_SECONDS = float(\'inf\')  # no artificial scan-time limit')
          p.write_text(s, encoding='utf-8')
          if 'MAX_FILES_PER_SCAN = float(\'inf\')' not in s or 'MAX_SCAN_CYCLE_SECONDS = float(\'inf\')' not in s:
              raise SystemExit('Expected scan limits were not found; refusing to commit')
          PY

      - name: Commit unlimited scan change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone_agent.py
          git diff --cached --quiet && exit 0
          git commit -m 'Remove standalone agent scan limits [unlimited-scan-patch]'
          git push origin HEAD:security-v2
