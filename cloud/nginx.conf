# nginx reverse proxy config for the antivirus cloud server.
#
# This gives you clean HTTPS on port 443 (no :8443 in the URL).
#
# Setup:
#   1. Install nginx
#   2. Copy this file to your nginx sites-enabled directory
#   3. Set BEHIND_PROXY=1 and PROXY_PORT=8000 in your .env
#   4. Get SSL certs (use certbot: sudo certbot --nginx -d soluzka.com)
#   5. Reload nginx: sudo nginx -s reload
#
# After this, the server is available at https://soluzka.com/ (no port needed)

server {
    listen 80;
    server_name soluzka.com www.soluzka.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name soluzka.com www.soluzka.com;

    # SSL certificates (use certbot to get these)
    ssl_certificate /etc/letsencrypt/live/soluzka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soluzka.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy to Flask server
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static files — let nginx serve them directly (faster)
    location /static/ {
        alias /path/to/antivirus-yara-rules-c/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
