<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="csrf-token" content="{{ session.csrf_token }}">
    <script>
        (function() {
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
            const originalFetch = window.fetch;
            window.fetch = function(resource, init) {
                init = init || {};
                if (init.method && ['POST', 'PUT', 'DELETE', 'PATCH'].includes(init.method.toUpperCase())) {
                    if (typeof resource === 'string' && resource.startsWith('/')) {
                        if (!init.headers) {
                            init.headers = {};
                        } else if (init.headers instanceof Headers) {
                            init.headers.set('X-CSRF-Token', csrfToken);
                            return originalFetch(resource, init);
                        }
                        if (!init.headers['X-CSRF-Token']) {
                            init.headers['X-CSRF-Token'] = csrfToken;
                        }
                    }
                }
                return originalFetch(resource, init);
            };
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Defender - Login</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo img {
            width: 150px;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .btn-primary {
            width: 100%;
        }
        .error {
            color: #dc3545;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Windows Defender">
        </div>
        <h2 class="text-center mb-4">Administrator Login</h2>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p class="text-center mt-3"><a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</body>
</html>
