<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="csrf-token" content="{{ session.csrf_token }}">
    <script>
        (function() {
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
            const originalFetch = window.fetch;
            window.fetch = function(resource, init) {
                init = init || {};
                if (init.method && ['POST', 'PUT', 'DELETE', 'PATCH'].includes(init.method.toUpperCase())) {
                    if (typeof resource === 'string' && resource.startsWith('/')) {
                        if (!init.headers) {
                            init.headers = {};
                        } else if (init.headers instanceof Headers) {
                            init.headers.set('X-CSRF-Token', csrfToken);
                            return originalFetch(resource, init);
                        }
                        if (!init.headers['X-CSRF-Token']) {
                            init.headers['X-CSRF-Token'] = csrfToken;
                        }
                    }
                }
                return originalFetch(resource, init);
            };
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Defender - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo img {
            width: 150px;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .btn-primary {
            width: 100%;
        }
        .error {
            color: #dc3545;
            margin-top: 0.5rem;
        }
        .message {
            color: #198754;
            margin-top: 0.5rem;
        }
        .section {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #dee2e6;
        }
        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
    </style>
</head>
<body>
<div id="favicon-icon-overlay"><img src="{{ url_for('static', filename='favicon.ico') }}" alt="Shield"></div>
    <div class="login-container">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Windows Defender">
        </div>

        <div class="section">
            <h2 class="text-center mb-4">Administrator Login</h2>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>

        <div class="section">
            <h3 class="text-center mb-3">Set Admin Password</h3>
            {% if register_error %}
            <div class="error">{{ register_error }}</div>
            {% endif %}
            {% if register_message %}
            <div class="message">{{ register_message }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="action" value="register">
                <div class="form-group">
                    <label for="reg_password">New Password</label>
                    <input type="password" class="form-control" id="reg_password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                </div>
                <button type="submit" class="btn btn-primary">Set Password</button>
            </form>
        </div>
    </div>
</body>
</html>
