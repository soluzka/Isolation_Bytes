<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ session.csrf_token }}">
    <meta name="device-id" content="{{ device_id }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isolation Bytes — Voice Repair Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { max-width: 900px; margin: 2em auto; font-family: 'Inter', Arial, sans-serif; background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); min-height: 100vh; color: #1f2937; padding: 0 1em; }
        h1 { color: #2d5f9a; }
        .card { background: #fff; border-radius: 8px; padding: 1.5em; margin: 1em 0; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .mic-wrap { text-align: center; margin: 1.5em 0; }
        #micBtn { width: 80px; height: 80px; border-radius: 50%; border: none; background: #2d5f9a; color: #fff; font-size: 2em; cursor: pointer; transition: transform .15s, background .15s; }
        #micBtn:hover { background: #1e3f6f; }
        #micBtn.listening { background: #e74c3c; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(231,76,60,.5); } 70% { box-shadow: 0 0 0 18px rgba(231,76,60,0); } 100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); } }
        .transcript { font-size: 1.1em; min-height: 1.5em; color: #334155; margin: 1em 0; }
        .response { background: #e0f2fe; border-left: 4px solid #2d5f9a; padding: 1em; border-radius: 4px; white-space: pre-wrap; }
        .error { background: #fee2e2; border-left-color: #e74c3c; }
        .suggestion { background: #fef3c7; border-left-color: #f59e0b; margin-top: .5em; }
        .input-row { display: flex; gap: .5em; margin: 1em 0; }
        input[type="text"] { flex: 1; padding: .6em .8em; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1em; }
        button.action { padding: .6em 1.2em; background: #2d5f9a; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button.action:hover { background: #1e3f6f; }
        .options { display: flex; align-items: center; gap: 1em; margin: 1em 0; font-size: .95em; color: #475569; flex-wrap: wrap; }
        .options select { padding: .3em .6em; border-radius: 4px; border: 1px solid #cbd5e1; }
        .chips { display: flex; flex-wrap: wrap; gap: .5em; margin: .5em 0; }
        .chip { background: #e2e8f0; color: #1e293b; border: none; border-radius: 16px; padding: .35em .9em; cursor: pointer; font-size: .9em; }
        .chip:hover { background: #cbd5e1; }
        nav a { display: inline-block; padding: .5em 1em; background: #7f8c8d; color: #fff; border-radius: 5px; text-decoration: none; margin-bottom: 1em; }
        #intentName { color: #64748b; font-size: .9em; margin-top: .5em; }
        #micStatus { color: #475569; font-size: .95em; margin-top: .5em; }
        #interim { color: #64748b; font-size: .95em; min-height: 1.2em; }
    </style>
</head>
<body>
    <nav><a href="/">Back to Dashboard</a></nav>
    <h1>Voice Repair Assistant</h1>
    <p>Speak or type a repair command. Examples: <em>"check my internet"</em>, <em>"clean temp files"</em>, <em>"is my disk healthy?"</em></p>

    {% if devices %}
    <div class="card">
        <label><strong>Target device:</strong>
            <select id="deviceSelect" style="margin-left: .5em; padding: .3em .6em; border-radius: 4px; border: 1px solid #cbd5e1;">
                {% for d in devices %}
                <option value="{{ d.device_id }}" {% if d.device_id == device_id %}selected{% endif %}>{{ d.hostname or d.device_id }} ({{ d.device_id }})</option>
                {% endfor %}
            </select>
        </label>
    </div>
    {% endif %}

    <div class="card">
        <div class="mic-wrap">
            <button id="micBtn" title="Click to speak">🎙</button>
            <div id="micStatus">Click the microphone, or type below</div>
            <div id="interim"></div>
        </div>

        <div class="input-row">
            <input type="text" id="commandInput" placeholder="Type your command here..." autocomplete="off">
            <button class="action" id="sendBtn">Send</button>
        </div>

        <div class="options">
            <label><input type="checkbox" id="speakResult" checked> Read response aloud</label>
            <label><input type="checkbox" id="applyFix" checked> Apply repair/cleanup when asked</label>
            <label>Voice: <select id="voiceSelect"></select></label>
            <button class="action" id="stopSpeakBtn" style="display:none;">Stop</button>
        </div>

        <div class="chips" id="chips"></div>
    </div>

    <div class="card" id="resultCard" style="display:none;">
        <div class="transcript"><strong>You said:</strong> <span id="transcript"></span></div>
        <div id="intentName"></div>
        <div class="response" id="response"></div>
        <div class="suggestion" id="suggestion" style="display:none;"></div>
    </div>

    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
        let deviceId = document.querySelector('meta[name="device-id"]')?.content || '';
        const deviceSelect = document.getElementById('deviceSelect');
        if (deviceSelect) {
            deviceId = deviceSelect.value || deviceId;
            deviceSelect.addEventListener('change', () => { deviceId = deviceSelect.value || ''; });
        }

        async function parseJsonResponse(res) {
            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                throw new Error(`Server returned ${res.status} (${text.slice(0, 80)})`);
            }
        }

        async function postCommand(command, applyFix=false) {
            const res = await fetch('/api/voice/command', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': csrfToken,
                },
                body: JSON.stringify({ command, apply_fix: applyFix, device_id: deviceId }),
                signal: AbortSignal.timeout(10000),
            });
            const data = await parseJsonResponse(res);
            if (data.status !== 'pending' || !data.job_id) {
                return data;
            }
            const maxWait = 90000;
            const interval = 1500;
            const start = Date.now();
            while (Date.now() - start < maxWait) {
                await new Promise(r => setTimeout(r, interval));
                const poll = await fetch('/api/voice/result?job_id=' + encodeURIComponent(data.job_id) + '&csrf_token=' + encodeURIComponent(csrfToken) + '&device_id=' + encodeURIComponent(deviceId), {
                    credentials: 'same-origin',
                    signal: AbortSignal.timeout(10000),
                });
                const pData = await parseJsonResponse(poll);
                if (pData.status === 'ok' || pData.status === 'error') {
                    return pData;
                }
            }
            throw new Error('Command timed out waiting for result');
        }

        function showResult(data) {
            const card = document.getElementById('resultCard');
            const responseEl = document.getElementById('response');
            const suggestionEl = document.getElementById('suggestion');
            card.style.display = 'block';
            document.getElementById('transcript').textContent = data.command || '';
            document.getElementById('intentName').textContent = data.intent ? `Intent: ${data.intent}` : '';
            responseEl.textContent = data.response || data.message || 'No response';
            responseEl.className = 'response' + (data.success === false ? ' error' : '');
            if (data.suggested_fix) {
                suggestionEl.style.display = 'block';
                suggestionEl.textContent = 'Suggested fix: ' + data.suggested_fix;
            } else {
                suggestionEl.style.display = 'none';
            }
            if (document.getElementById('speakResult').checked) {
                speak(data.response || data.message || '');
            }
        }

        let voices = [];
        const voiceSelect = document.getElementById('voiceSelect');
        const stopSpeakBtn = document.getElementById('stopSpeakBtn');

        function populateVoices() {
            voices = window.speechSynthesis.getVoices();
            voiceSelect.innerHTML = '';
            voices.forEach((v, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${v.name} (${v.lang})`;
                voiceSelect.appendChild(opt);
            });
            const preferred = voices.findIndex(v => /Google US English|Microsoft.*David|Samantha|Daniel|Karen/i.test(v.name));
            if (preferred >= 0) voiceSelect.value = preferred;
        }

        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = populateVoices;
            populateVoices();
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            if (!text) return;
            const u = new SpeechSynthesisUtterance(text);
            u.rate = 1.0;
            u.pitch = 1.0;
            u.volume = 1.0;
            if (voices.length && voiceSelect.value !== '') {
                const v = voices[voiceSelect.value];
                if (v) u.voice = v;
            }
            u.onstart = () => stopSpeakBtn.style.display = 'inline-block';
            u.onend = () => stopSpeakBtn.style.display = 'none';
            u.onerror = () => stopSpeakBtn.style.display = 'none';
            window.speechSynthesis.speak(u);
        }

        stopSpeakBtn.onclick = () => {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            stopSpeakBtn.style.display = 'none';
        };

        async function handleCommand(command) {
            const applyFix = document.getElementById('applyFix').checked;
            if (!command) return;
            showResult({ command, response: 'Thinking...' });
            try {
                const data = await postCommand(command, applyFix);
                showResult(data);
            } catch (e) {
                showResult({ command, response: 'Network error: ' + e, success: false });
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const micBtn = document.getElementById('micBtn');
        const micStatus = document.getElementById('micStatus');
        const interim = document.getElementById('interim');
        const commandInput = document.getElementById('commandInput');
        let recognition, listening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                listening = true;
                micBtn.classList.add('listening');
                micStatus.textContent = 'Listening...';
                interim.textContent = '';
            };
            recognition.onend = () => {
                listening = false;
                micBtn.classList.remove('listening');
                micStatus.textContent = 'Click the microphone, or type below';
            };
            recognition.onerror = (e) => {
                listening = false;
                micBtn.classList.remove('listening');
                micStatus.textContent = 'Speech error: ' + e.error;
                interim.textContent = '';
            };
            recognition.onresult = (e) => {
                let final = '';
                let inter = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const t = e.results[i][0].transcript;
                    if (e.results[i].isFinal) final += t;
                    else inter += t;
                }
                interim.textContent = inter;
                if (final) {
                    commandInput.value = final.trim();
                    interim.textContent = '';
                    handleCommand(final.trim());
                }
            };

            micBtn.onclick = () => {
                if (!listening) {
                    if (window.speechSynthesis) window.speechSynthesis.cancel();
                    recognition.start();
                } else {
                    recognition.stop();
                }
            };
        } else {
            micBtn.disabled = true;
            micStatus.textContent = 'Speech recognition not supported in this browser.';
        }

        document.getElementById('sendBtn').onclick = () => {
            handleCommand(commandInput.value.trim());
        };
        commandInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleCommand(commandInput.value.trim());
        });

        const examples = [
            'check my system status',
            'is my internet working',
            'disk space',
            'clean temp files',
            'top processes',
            'check updates',
            'hardware specs',
            'flush dns now',
        ];
        const chips = document.getElementById('chips');
        examples.forEach(ex => {
            const b = document.createElement('button');
            b.className = 'chip';
            b.textContent = ex;
            b.onclick = () => {
                commandInput.value = ex;
                handleCommand(ex);
            };
            chips.appendChild(b);
        });
    </script>
</body>
</html>
