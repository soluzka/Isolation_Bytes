<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Defender - Startup With Windows</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .startupw-container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: 2rem auto; max-width: 600px; text-align: center; }
        .status { font-size: 1.5rem; font-weight: bold; margin: 1rem 0; }
        .active { color: #27ae60; }
        .inactive { color: #c0392b; }
    </style>
</head>
<body>
<div id="favicon-icon-overlay"><img src="{{ url_for('static', filename='favicon.ico') }}" alt="Shield"></div>
    <div class="startupw-container">
        <h2 class="mb-4">Startup With Windows</h2>
        <p>Run the antivirus dashboard when you log in to Windows.</p>

        {% if active %}
        <div class="status active">ENABLED</div>
        <form method="POST" action="{{ url_for('startup_with_windows') }}">
            <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
            <input type="hidden" name="action" value="disable">
            <button type="submit" class="btn btn-danger btn-lg">Disable</button>
        </form>
        {% else %}
        <div class="status inactive">DISABLED</div>
        <form method="POST" action="{{ url_for('startup_with_windows') }}">
            <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
            <input type="hidden" name="action" value="enable">
            <button type="submit" class="btn btn-success btn-lg">Enable</button>
        </form>
        {% endif %}

        {% if message %}
        <div class="alert alert-info mt-3">{{ message }}</div>
        {% endif %}

        <p class="text-center mt-3"><a href="{{ url_for('index') }}">Back to dashboard</a></p>
    </div>
</body>
</html>
