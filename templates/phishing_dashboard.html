<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="csrf-token" content="{{ session.csrf_token }}">
    <script>
        (function() {
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
            const originalFetch = window.fetch;
            window.fetch = function(resource, init) {
                init = init || {};
                if (init.method && ['POST', 'PUT', 'DELETE', 'PATCH'].includes(init.method.toUpperCase())) {
                    if (typeof resource === 'string' && resource.startsWith('/')) {
                        if (!init.headers) {
                            init.headers = {};
                        } else if (init.headers instanceof Headers) {
                            init.headers.set('X-CSRF-Token', csrfToken);
                            return originalFetch(resource, init);
                        }
                        if (!init.headers['X-CSRF-Token']) {
                            init.headers['X-CSRF-Token'] = csrfToken;
                        }
                    }
                }
                return originalFetch(resource, init);
            };
        })();
    </script>
    <meta charset="UTF-8">
    <title>Phishing Alerts Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; position: relative; }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('{{ url_for('static', filename='shield_bg.png') }}') no-repeat center fixed;
            background-size: 300px;
            opacity: 0.12;
            z-index: -1;
            pointer-events: none;
        }
        h2 { color: #b30000; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 0.5em; }
        th { background: #f5f5f5; }
        tr.phishing { background: #ffeaea; }
        .type { font-weight: bold; }
    </style>
</head>
<body>
<div id="favicon-icon-overlay"><img src="{{ url_for('static', filename='favicon.ico') }}" alt="Shield"></div>
    <h2>Phishing Alerts Dashboard</h2>
    <table>
        <tr>
            <th>Time</th>
            <th>Source</th>
            <th>Summary</th>
            <th>Details</th>
        </tr>
        {% for alert in alerts %}
        <tr class="{{ 'phishing' if alert.phishing else '' }}">
            <td>{{ alert.timestamp }}</td>
            <td>{{ alert.source }}</td>
            <td>{{ alert.summary }}</td>
            <td><pre>{{ alert.details }}</pre></td>
        </tr>
        {% endfor %}
    </table>
    {% if not alerts %}<p>No phishing alerts yet.</p>{% endif %}
</body>
</html>
